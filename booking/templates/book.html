{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Booking Form</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<section class="booking-section">
    <h2>Room Booking</h2>

    <form method="POST" enctype="multipart/form-data" class="booking-form">

        {% csrf_token %}

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="tel" name="contact" placeholder="Contact Number" required>

        <input type="number" name="age" placeholder="Age" required>

        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label>Check-in Date</label>
        <input type="date" name="checkin" required>

        <label>Check-out Date</label>
        <input type="date" name="checkout" required>

        <input type="number" name="members" placeholder="No. of Members" min="1" required>

        <select name="room_type" id="room_type" required>
            <option value="">Select Room Type</option>
            <option value="Non-AC" data-price="1000">Non-AC - ₹1000/day</option>
            <option value="AC" data-price="1500">AC - ₹1500/day</option>
            <option value="Premium" data-price="2500">Premium - ₹2500/day</option>
            <option value="Luxury" data-price="4000">Luxury - ₹4000/day</option>
        </select>
        <label>ID Proof</label>
        <input type="file" name="id_proof" required>

        <input type="number" name="no_of_rooms" placeholder="No. of Rooms" min="1" required>
        <h3>Total Amount: ₹ <span id="totalAmount">0</span></h3>
        <h3>Scan & Pay</h3>
        <img id="qrCode" width="200" style="margin-top:10px;">

        <textarea name="message" placeholder="Your Message"></textarea>
        <p id="successMsg" style="color:green; display:none;">Booking Successful! Thank you for booking.</p>

        <button type="submit">Book Now</button>

    </form>
</section>

<script src="{% static 'booking.js' %}"></script>

</body>
</html>
